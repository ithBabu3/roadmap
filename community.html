<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Community — .NET Full Stack Roadmap</title>
<script>try{var t=localStorage.getItem('dn_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<link href="css/login.css" rel="stylesheet">
<link href="css/royal.css" rel="stylesheet">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="index.html"><span class="brand-logo"><i class="bi bi-gem"></i></span>
    <span class="brand-text"><b>Community</b><small>Leaderboard &amp; shared progress</small></span></a>
  <div class="topbar-actions">
    <button type="button" class="icon-btn" id="theme-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button>
    <a class="btn btn-sm btn-primary" href="index.html"><i class="bi bi-arrow-left me-1"></i>My roadmap</a>
  </div>
</div></header>
<main class="container" style="max-width:700px;padding:1.2rem 1rem 3rem">
  <div class="page-head"><div><h2><i class="bi bi-trophy-fill"></i>Leaderboard</h2>
    <p>Only people who switched on sharing in their Profile appear here.</p></div></div>
  <div id="shared"></div>
  <div id="board"><div class="text-muted small">Loading…</div></div>
</main>
<script>
  (function(){var r=document.documentElement,b=document.getElementById('theme-btn');
  function p(){b.firstElementChild.className='bi '+(r.getAttribute('data-theme')==='dark'?'bi-sun':'bi-moon-stars');}
  b.onclick=function(){var n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('dn_theme',n);}catch(e){}p();};p();})();
</script>
<script type="module" src="js/community-page.js"></script>
</body>
</html>
